name: Deploy do frontend no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    name: Testes (regras, pistas e interface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Testes de regras do servidor
        run: npm run test:server
      - name: Simulação das 5 pistas
        run: npm run test:tracks
      - name: Testes de interface (jsdom)
        run: npm run test:ui

  construir:
    name: Build do frontend
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do frontend
        run: npm ci --prefix frontend
      - name: Build (Vite)
        env:
          # Configure em Settings → Secrets and variables → Actions → Variables
          # com a URL pública do backend no Render (sem barra no final).
          VITE_SERVER_URL: ${{ vars.CHAOS_SERVER_URL }}
        run: npm run build
      - name: Conferir artefato
        run: |
          test -f frontend/dist/index.html
          du -sh frontend/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    name: Publicar no Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
